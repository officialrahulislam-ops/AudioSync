name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: latest

      - name: Install Android SDK packages
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x AndroidReceiver/gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android APK
        working-directory: AndroidReceiver
        run: ./gradlew assembleRelease

      - name: Verify APK exists
        working-directory: AndroidReceiver
        run: ls -la app/build/outputs/apk/release/

      - name: Find APK path
        id: find_apk
        working-directory: AndroidReceiver
        run: echo "path=$(find app/build/outputs/apk -name '*.apk' -type f | head -1)" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: audiosync-receiver-apk
          path: AndroidReceiver/${{ steps.find_apk.outputs.path }}
          if-no-files-found: error