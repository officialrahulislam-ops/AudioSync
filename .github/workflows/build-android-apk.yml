name: Build Android APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 25.2.9520075

      - name: Grant execute permission for Gradle wrapper
        run: chmod +x AndroidReceiver/gradlew

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build Android APK
        working-directory: AndroidReceiver
        run: ./gradlew assembleRelease

      - name: Verify APK exists
        working-directory: AndroidReceiver
        run: ls -la app/build/outputs/apk/release/

      - name: Find and upload APK artifact
        run: |
          APK_PATH=$(find AndroidReceiver/app/build/outputs/apk -name '*.apk' -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found, looking for debug APK"
            APK_PATH=$(find AndroidReceiver/app/build/outputs/apk -name '*.apk' -type f | head -1)
          fi
          echo "Found APK: $APK_PATH"
          ls -la "$APK_PATH"
        id: find_apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiosync-receiver-apk
          path: ${{ steps.find_apk.outputs.path }}
          if-no-files-found: error