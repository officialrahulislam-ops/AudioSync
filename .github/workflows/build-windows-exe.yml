name: Build Windows EXE

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        working-directory: WindowsSender
        run: dotnet restore

      - name: Build Windows EXE
        working-directory: WindowsSender
        run: dotnet build -c Release -r win-x64 --self-contained false

      - name: Publish standalone EXE
        working-directory: WindowsSender
        run: dotnet publish -c Release -r win-x64 --self-contained true

      - name: Verify EXE exists
        working-directory: WindowsSender
        run: ls -la bin/Release/net8.0-windows/win-x64/AudioSync.Win.exe

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: audiosync-sender-exe
          path: WindowsSender/bin/Release/net8.0-windows/win-x64/AudioSync.Win.exe
          if-no-files-found: error